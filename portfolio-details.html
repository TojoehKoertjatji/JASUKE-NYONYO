  <!-- Main JS File -->
  <script src="assets/js/main.js"></script>

  <!-- Menu Detail Data -->
  <script>
    const detailData = [
      {
        title: "Jasuke Orisinal",
        description: "Jasuke Orisinal merupakan perpaduan jagung manis, susu, dan keju dengan cita rasa khas. Varian ini menghadirkan rasa gurih dan manis yang menyatu dalam sajian camilan sederhana dan nikmat."
      },
      {
        title: "Jasuke Coklat",
        description: "Jasuke Coklat merupakan jasuke dengan tambahan coklat yang memberikan sensasi rasa manis. Perpaduan jagung, susu, keju, dan coklat menghadirkan variasi rasa yang menarik untuk dinikmati."
      },
      {
        title: "Jasuke Pedas",
        description: "Jasuke Pedas merupakan pilihan jasuke dengan sentuhan rasa pedas bagi pencinta cita rasa gurih dan pedas. Varian ini memberikan alternatif rasa yang berbeda dari jasuke pada umumnya."
      }
    ];

    window.addEventListener("load", function () {

      // Mengambil elemen slider
      const sliderElement = document.querySelector(
        ".portfolio-details-slider"
      );

      if (!sliderElement || !sliderElement.swiper) {
        console.error("Swiper belum berhasil diinisialisasi.");
        return;
      }

      // Mengambil Swiper
      const swiper = sliderElement.swiper;

      // Mengambil ID menu dari URL
      const params = new URLSearchParams(window.location.search);
      const selectedId = Number(params.get("id") || 0);

      // Memastikan ID sesuai dengan jumlah menu
      const initialIndex =
        selectedId >= 0 && selectedId < detailData.length
          ? selectedId
          : 0;

      // Menampilkan gambar sesuai menu yang dipilih
      swiper.slideToLoop(initialIndex, 0);

      // Memperbarui informasi detail menu
      function updateDetail() {

        const index = swiper.realIndex;
        const detail = detailData[index];

        if (!detail) return;

        document.getElementById("detail-title").textContent =
          detail.title;

        document.getElementById("detail-number").textContent =
          (index + 1) + " dari " + detailData.length;

        document.getElementById("detail-heading").textContent =
          detail.title;

        document.getElementById("detail-description").textContent =
          detail.description;
      }

      // Memperbarui informasi ketika slider berubah
      swiper.on("slideChange", updateDetail);

      // Menampilkan informasi awal
      updateDetail();

    });
  </script>
